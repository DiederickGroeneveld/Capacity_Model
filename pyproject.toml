[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-model"
version = "0.1.0"
description = "Streamlit app scaffold for capacity modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<6.0",
    "streamlit>=1.39,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
